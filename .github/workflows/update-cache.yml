name: Atualizar cache AVMirror

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  refresh-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Gerar catálogo e metadados
        env:
          BROWSER_HEADLESS: "true"
          CACHE_PAGES: "1"
          CACHE_META_LIMIT: "40"
        run: node scripts/update-cache.js
      - name: Publicar somente se houver mudanças
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cache/
          if git diff --cached --quiet; then
            echo "Cache sem alterações"
          else
            git commit -m "chore: refresh catalog cache"
            git push
          fi
