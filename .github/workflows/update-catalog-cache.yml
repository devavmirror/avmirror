name: Update AVMirror catalog cache

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog-cache
  cancel-in-progress: true

jobs:
  update-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Scrape AVMirror catalogs
        env:
          CACHE_PAGES: "3"
          REQUEST_TIMEOUT_MS: "12000"
        run: npm run cache:update

      - name: Commit changed cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog
          if git diff --cached --quiet; then
            echo "No catalog changes"
            exit 0
          fi
          git commit -m "chore(cache): update AVMirror catalogs"
          git push
