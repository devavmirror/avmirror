services:
  - type: web
    name: avmirror
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "7000"
      - key: BASE_URL
        value: "https://jav.guru"
      - key: PUBLIC_BASE_URL
        value: "https://avmirror-3843.onbelmo.uk"
      - key: LOCAL_MODE
        value: "false"
      - key: CACHE_TTL_MS
        value: "900000"
      - key: CACHE_MAX_ENTRIES
        value: "300"
      - key: REQUEST_TIMEOUT_MS
        value: "25000"
      - key: PLAYER_TIMEOUT_MS
        value: "25000"
      - key: IMAGE_TIMEOUT_MS
        value: "12000"
      - key: IMAGE_MAX_BYTES
        value: "4194304"
      - key: IMAGE_CACHE_MAX_ENTRIES
        value: "120"
      - key: IMAGE_CACHE_MAX_BYTES
        value: "50331648"
      - key: MAX_STREAM_MBPS
        value: "8"
      - key: BROWSER_HEADLESS
        value: "true"
      - key: ENABLE_BROWSER_STREAMS
        value: "false"
      - key: TORRENT_TIMEOUT_MS
        value: "60000"
      - key: TORRENT_MAX_ACTIVE
        value: "10"
      - key: TORRENT_STALE_MS
        value: "480000"
      - key: MAX_TORRENT_SIZE_MB
        value: "1500"
      - key: PROXY_URL
        value: "https://avmirror-proxy.dev-avmirror.workers.dev"
